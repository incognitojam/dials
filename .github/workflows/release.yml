name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select release mode
        id: mode
        uses: changesets/action/select-mode@v2.1.1
      - name: Read the proposed versions
        if: steps.mode.outputs.mode == 'version'
        id: next
        run: |
          status="$RUNNER_TEMP/changeset-status.json"
          npm run changeset -- status --output="$status"
          echo "title=$(node scripts/release-apps.mjs title "$status")" >> "$GITHUB_OUTPUT"
      - name: Create or update the release pull request
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: npm run release:version
          commit-message: "release: version apps"
          pr-title: ${{ steps.next.outputs.title }}
      - name: Read the apps to release
        if: steps.mode.outputs.mode == 'publish'
        id: plan
        run: |
          plan="$RUNNER_TEMP/changeset-publish-plan.json"
          npm run changeset -- publish-plan --output "$plan"
          echo "apps=$(node scripts/release-apps.mjs matrix "$plan")" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test
      - name: Build apps
        env:
          APPS: ${{ needs.prepare.outputs.apps }}
        run: |
          for app in $(jq -r '.[].app' <<< "$APPS"); do
            ./scripts/build-app.sh "$app"
            codesign --verify --strict "build/$app.app"
            ditto -c -k --sequesterRsrc --keepParent "build/$app.app" "build/$app.zip"
          done
      - name: Tag the tested commit and publish the GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPS: ${{ needs.prepare.outputs.apps }}
        run: |
          while IFS=$'\t' read -r app version tag; do
            notes="$RUNNER_TEMP/$app-release-notes.md"
            awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' "Resources/$app/CHANGELOG.md" > "$notes"
            grep -q . "$notes"
            mv "build/$app.zip" "build/$app-$version.zip"
            prerelease=()
            if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$tag" "build/$app-$version.zip" --target "$GITHUB_SHA" --title "$app v$version" --notes-file "$notes" "${prerelease[@]}"
          done < <(jq -r '.[] | [.app, .version, .tag] | @tsv' <<< "$APPS")
