name: Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  version:
    name: Version apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create or update release pull request
        uses: changesets/action/version@v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: npm run release:version
          commit-message: "release: version apps"
          pr-title: "release: version apps"
