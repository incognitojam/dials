name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require a release decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          found=0
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .changeset/*.md)
                if [ "$changed_file" != ".changeset/README.md" ]; then
                  found=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- .changeset)
          if [ "$found" -ne 1 ]; then
            echo "Add a release note with 'npm run changeset' or record no release impact with 'npm run changeset -- --empty'." >&2
            exit 1
          fi
      - name: Validate changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run changeset -- status --since "$BASE_SHA"
      - name: Check app versions
        run: npm run version:check

  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.paths.outputs.app }}
      core: ${{ steps.paths.outputs.core }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect app and core changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          if grep -qE '^(Sources|Tests|Resources|scripts)/|^Package\.(swift|resolved)$|^\.github/workflows/ci\.yml$' "$RUNNER_TEMP/changed-paths"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^Sources/[^/]*Core/|^Tests/[^/]*CoreTests/|^Package\.(swift|resolved)$|^\.github/workflows/ci\.yml$' "$RUNNER_TEMP/changed-paths"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12

  linux:
    name: Linux
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run portable tests
        run: swift test

  macos:
    name: macOS
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test
      - name: Build apps
        run: |
          for app in neqMac nitMac; do
            ./scripts/build-app.sh "$app"
            codesign --verify --strict "build/$app.app"
            ditto -c -k --sequesterRsrc --keepParent "build/$app.app" "build/$app.zip"
          done
      - name: Upload apps
        uses: actions/upload-artifact@v7
        with:
          name: apps
          path: build/*.zip
          if-no-files-found: error
